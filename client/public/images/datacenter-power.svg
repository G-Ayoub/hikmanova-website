<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration: datacenter racks, UPS and cooling feed a dashboard whose correlated signals point to one root cause">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F4B" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#DCE7FF" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#F4F7FF"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.8"/>
  <ellipse cx="290" cy="602" rx="250" ry="20" fill="#0B1F4B" opacity="0.08"/>

  <!-- Server racks -->
  <g filter="url(#shadow)">
    <g transform="translate(70 110)">
      <rect width="130" height="480" rx="14" fill="#0B1F4B"/>
      <g fill="#1B3473">
        <rect x="14" y="20" width="102" height="44" rx="6"/>
        <rect x="14" y="74" width="102" height="44" rx="6"/>
        <rect x="14" y="128" width="102" height="44" rx="6"/>
        <rect x="14" y="182" width="102" height="44" rx="6"/>
        <rect x="14" y="236" width="102" height="44" rx="6"/>
        <rect x="14" y="290" width="102" height="44" rx="6"/>
        <rect x="14" y="344" width="102" height="44" rx="6"/>
        <rect x="14" y="398" width="102" height="44" rx="6"/>
      </g>
      <g fill="#5EEAD4">
        <circle cx="30" cy="42" r="5"/><circle cx="30" cy="96" r="5"/><circle cx="30" cy="150" r="5"/>
        <circle cx="30" cy="258" r="5"/><circle cx="30" cy="312" r="5"/><circle cx="30" cy="366" r="5"/><circle cx="30" cy="420" r="5"/>
      </g>
      <circle cx="30" cy="204" r="5" fill="#F59E0B"/>
      <g stroke="#3B5BA8" stroke-width="4" stroke-linecap="round">
        <path d="M50 42 H100 M50 96 H100 M50 150 H100 M50 204 H100 M50 258 H100 M50 312 H100 M50 366 H100 M50 420 H100"/>
      </g>
    </g>
    <g transform="translate(220 110)">
      <rect width="130" height="480" rx="14" fill="#0B1F4B"/>
      <g fill="#1B3473">
        <rect x="14" y="20" width="102" height="44" rx="6"/>
        <rect x="14" y="74" width="102" height="44" rx="6"/>
        <rect x="14" y="128" width="102" height="98" rx="6"/>
        <rect x="14" y="236" width="102" height="44" rx="6"/>
        <rect x="14" y="290" width="102" height="44" rx="6"/>
        <rect x="14" y="344" width="102" height="98" rx="6"/>
      </g>
      <g fill="#5EEAD4">
        <circle cx="30" cy="42" r="5"/><circle cx="30" cy="96" r="5"/><circle cx="30" cy="150" r="5"/>
        <circle cx="30" cy="258" r="5"/><circle cx="30" cy="312" r="5"/><circle cx="30" cy="366" r="5"/>
      </g>
      <g stroke="#3B5BA8" stroke-width="4" stroke-linecap="round">
        <path d="M50 42 H100 M50 96 H100 M50 150 H100 M50 258 H100 M50 312 H100 M50 366 H100"/>
      </g>
    </g>
  </g>

  <!-- Precision cooling (CRAC) -->
  <g transform="translate(372 110)" filter="url(#shadow)">
    <rect width="150" height="210" rx="16" fill="#FFFFFF" stroke="#0B1F4B" stroke-width="5"/>
    <circle cx="75" cy="88" r="46" fill="#E6EEFF"/>
    <g transform="translate(75 88)" fill="#2F6BFF">
      <path d="M0 -6 C 6 -30 28 -30 30 -16 C 31 -6 16 0 0 0 Z"/>
      <path d="M0 -6 C 6 -30 28 -30 30 -16 C 31 -6 16 0 0 0 Z" transform="rotate(120)"/>
      <path d="M0 -6 C 6 -30 28 -30 30 -16 C 31 -6 16 0 0 0 Z" transform="rotate(240)"/>
      <circle r="8" fill="#0B1F4B"/>
    </g>
    <rect x="22" y="158" width="106" height="30" rx="8" fill="#0B1F4B"/>
    <text x="75" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#5EEAD4">22°</text>
  </g>

  <!-- UPS -->
  <g transform="translate(372 350)" filter="url(#shadow)">
    <rect width="150" height="240" rx="16" fill="#FFFFFF" stroke="#0B1F4B" stroke-width="5"/>
    <rect x="22" y="24" width="106" height="44" rx="8" fill="#0B1F4B"/>
    <path d="M70 32 L58 50 H72 L64 62" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="38" width="32" height="16" rx="3" fill="none" stroke="#5EEAD4" stroke-width="3"/>
    <g fill="#E6EEFF">
      <rect x="22" y="88" width="106" height="28" rx="6"/>
      <rect x="22" y="126" width="106" height="28" rx="6"/>
      <rect x="22" y="164" width="106" height="28" rx="6"/>
    </g>
    <g fill="#2F6BFF">
      <rect x="22" y="88" width="88" height="28" rx="6"/>
      <rect x="22" y="126" width="80" height="28" rx="6"/>
      <rect x="22" y="164" width="48" height="28" rx="6" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Data path -->
  <path d="M540 300 C 580 300 590 250 630 250" fill="none" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M540 470 C 590 470 590 420 630 420" fill="none" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- Dashboard -->
  <g transform="translate(630 70)" filter="url(#shadow)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF"/>

    <!-- Topology map -->
    <g transform="translate(30 30)">
      <rect width="440" height="190" rx="18" fill="#F7F9FF"/>
      <g stroke="#B9CBF5" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M220 52 L100 132 M220 52 L220 132 M220 52 L340 132"/>
        <path d="M100 132 L60 160 M100 132 L140 160"/>
      </g>
      <path d="M220 52 L340 132" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="220" cy="52" r="20" fill="#0B1F4B"/>
      <path d="M223 40 L213 55 H225 L217 66" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="132" r="16" fill="#2F6BFF"/>
      <circle cx="220" cy="132" r="16" fill="#2F6BFF"/>
      <circle cx="340" cy="132" r="30" fill="#F59E0B" opacity="0.2"/>
      <circle cx="340" cy="132" r="16" fill="#F59E0B"/>
      <circle cx="60" cy="160" r="10" fill="#14B8A6"/>
      <circle cx="140" cy="160" r="10" fill="#14B8A6"/>
    </g>

    <!-- Correlated signals -->
    <g transform="translate(30 244)">
      <rect width="440" height="200" rx="18" fill="#F7F9FF"/>
      <!-- voltage (drops) -->
      <path d="M20 46 L80 42 L140 48 L200 44 L260 46 L300 48 L320 78 L420 82" fill="none" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- temperature (rises) -->
      <path d="M20 120 L80 116 L140 122 L200 118 L260 120 L300 118 L330 92 L420 88" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- load (spikes) -->
      <path d="M20 170 L80 166 L140 172 L200 168 L260 170 L300 168 L312 132 L326 176 L420 170" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- root-cause marker -->
      <path d="M312 14 V186" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 7"/>
      <circle cx="312" cy="14" r="11" fill="#F59E0B"/>
      <circle cx="312" cy="14" r="22" fill="#F59E0B" opacity="0.2"/>
    </g>

    <rect x="30" y="468" width="120" height="12" rx="6" fill="#0B1F4B" opacity="0.18"/>
    <rect x="166" y="468" width="80" height="12" rx="6" fill="#0B1F4B" opacity="0.12"/>
  </g>
</svg>
