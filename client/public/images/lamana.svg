<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration: a parcel travelling from France to Algeria, tracked on a phone">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE7FF"/>
      <stop offset="1" stop-color="#C7D8FF"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#9DB6EE"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#F4F7FF"/>

  <!-- Mediterranean -->
  <path d="M0 255 C 180 225 360 300 560 280 S 900 230 1200 260 L1200 455 C 980 430 800 485 560 460 S 200 430 0 470 Z" fill="url(#sea)"/>
  <g stroke="#9DB6EE" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M110 360 q 18 -12 36 0 t 36 0"/>
    <path d="M420 400 q 18 -12 36 0 t 36 0"/>
    <path d="M700 330 q 18 -12 36 0 t 36 0"/>
    <path d="M230 425 q 18 -12 36 0 t 36 0"/>
  </g>

  <!-- North shore (France), abstract -->
  <path d="M0 0 H 780 C 760 70 800 130 760 185 C 720 240 640 225 560 245 C 470 268 390 232 300 250 C 200 270 110 230 0 240 Z" fill="#E9EFFD"/>
  <path d="M0 0 H 780 C 760 70 800 130 760 185 C 720 240 640 225 560 245 C 470 268 390 232 300 250 C 200 270 110 230 0 240 Z" fill="url(#dots)" opacity="0.7"/>

  <!-- South shore (Algeria), abstract -->
  <path d="M0 485 C 160 455 330 490 480 470 C 620 452 720 500 820 480 L 820 675 H 0 Z" fill="#E9EFFD"/>
  <path d="M0 485 C 160 455 330 490 480 470 C 620 452 720 500 820 480 L 820 675 H 0 Z" fill="url(#dots)" opacity="0.7"/>

  <!-- Route -->
  <path d="M250 150 C 330 300 520 330 560 555" fill="none" stroke="#2F6BFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- Origin pin: FR -->
  <g transform="translate(250 150)">
    <circle r="34" fill="#2F6BFF" opacity="0.15"/>
    <circle r="14" fill="#2F6BFF"/>
    <circle r="5" fill="#FFFFFF"/>
    <g transform="translate(-92 -66)">
      <rect width="72" height="40" rx="12" fill="#0B1F4B"/>
      <text x="36" y="27" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">FR</text>
    </g>
  </g>

  <!-- Destination pin: DZ -->
  <g transform="translate(560 555)">
    <circle r="40" fill="#14B8A6" opacity="0.18"/>
    <circle r="16" fill="#14B8A6"/>
    <path d="M-7 0 l5 5 l10 -11" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(28 18)">
      <rect width="72" height="40" rx="12" fill="#0B1F4B"/>
      <text x="36" y="27" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">DZ</text>
    </g>
  </g>

  <!-- Parcel in transit -->
  <g transform="translate(398 300)" filter="url(#shadow)">
    <path d="M0 -46 L58 -18 L58 44 L0 72 L-58 44 L-58 -18 Z" fill="#F5B85A"/>
    <path d="M0 -46 L58 -18 L0 10 L-58 -18 Z" fill="#FFD597"/>
    <path d="M0 10 L0 72 L-58 44 L-58 -18 Z" fill="#E59E35"/>
    <path d="M-29 -32 L29 -4 L29 24" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Phone with tracking -->
  <g transform="translate(880 64)" filter="url(#shadow)">
    <rect width="250" height="540" rx="38" fill="#0B1F4B"/>
    <rect x="12" y="12" width="226" height="516" rx="28" fill="#FFFFFF"/>
    <rect x="95" y="24" width="60" height="8" rx="4" fill="#0B1F4B" opacity="0.15"/>

    <!-- header -->
    <rect x="32" y="56" width="186" height="104" rx="18" fill="#2F6BFF"/>
    <g transform="translate(56 80)">
      <path d="M0 10 L22 0 L44 10 L44 38 L22 48 L0 38 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0 10 L22 20 L44 10 M22 20 V48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <rect x="118" y="86" width="78" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="118" y="106" width="54" height="10" rx="5" fill="#FFFFFF" opacity="0.55"/>

    <!-- timeline -->
    <path d="M58 200 V 420" stroke="#DCE7FF" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 200 V 340" stroke="#2F6BFF" stroke-width="6" stroke-linecap="round"/>

    <circle cx="58" cy="200" r="13" fill="#2F6BFF"/>
    <path d="M52 200 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="88" y="190" width="110" height="10" rx="5" fill="#0B1F4B" opacity="0.75"/>
    <rect x="88" y="208" width="70" height="8" rx="4" fill="#0B1F4B" opacity="0.25"/>

    <circle cx="58" cy="270" r="13" fill="#2F6BFF"/>
    <path d="M52 270 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="88" y="260" width="96" height="10" rx="5" fill="#0B1F4B" opacity="0.75"/>
    <rect x="88" y="278" width="80" height="8" rx="4" fill="#0B1F4B" opacity="0.25"/>

    <circle cx="58" cy="340" r="20" fill="#2F6BFF" opacity="0.18"/>
    <circle cx="58" cy="340" r="11" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="6"/>
    <rect x="88" y="330" width="120" height="10" rx="5" fill="#2F6BFF"/>
    <rect x="88" y="348" width="64" height="8" rx="4" fill="#0B1F4B" opacity="0.25"/>

    <circle cx="58" cy="420" r="11" fill="#FFFFFF" stroke="#C3CEE6" stroke-width="5"/>
    <rect x="88" y="410" width="100" height="10" rx="5" fill="#0B1F4B" opacity="0.2"/>
    <rect x="88" y="428" width="60" height="8" rx="4" fill="#0B1F4B" opacity="0.12"/>

    <!-- action -->
    <rect x="32" y="468" width="186" height="40" rx="14" fill="#14B8A6"/>
    <rect x="86" y="484" width="78" height="9" rx="4.5" fill="#FFFFFF"/>
  </g>
</svg>
