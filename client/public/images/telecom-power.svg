<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration: a telecom tower site with rectifiers, batteries and a generator reporting to a multi-site map that flags one site, with a declining battery-health trend">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F4B" flood-opacity="0.16"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#B9CBF5"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#F4F7FF"/>
  <path d="M0 560 H 620" stroke="#C7D5F5" stroke-width="4"/>
  <ellipse cx="300" cy="566" rx="270" ry="16" fill="#0B1F4B" opacity="0.07"/>

  <!-- Tower -->
  <g stroke="#0B1F4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M130 560 L180 120 L230 560"/>
    <path d="M142 455 L218 455 M152 365 L208 365 M162 275 L198 275 M171 195 L189 195"/>
    <path d="M142 455 L208 365 M218 455 L152 365 M152 365 L198 275 M208 365 L162 275 M162 275 L189 195 M198 275 L171 195"/>
  </g>
  <g fill="#2F6BFF">
    <rect x="146" y="150" width="14" height="52" rx="5"/>
    <rect x="200" y="150" width="14" height="52" rx="5"/>
  </g>
  <circle cx="180" cy="112" r="10" fill="#0B1F4B"/>
  <g fill="none" stroke="#2F6BFF" stroke-width="6" stroke-linecap="round">
    <path d="M222 82 A 52 52 0 0 1 222 142" opacity="0.85"/>
    <path d="M246 60 A 84 84 0 0 1 246 164" opacity="0.5"/>
    <path d="M138 82 A 52 52 0 0 0 138 142" opacity="0.85"/>
    <path d="M114 60 A 84 84 0 0 0 114 164" opacity="0.5"/>
  </g>

  <!-- Site equipment -->
  <g filter="url(#shadow)">
    <!-- rectifier cabinet -->
    <g transform="translate(270 330)">
      <rect width="120" height="230" rx="14" fill="#FFFFFF" stroke="#0B1F4B" stroke-width="5"/>
      <g fill="#E6EEFF">
        <rect x="18" y="20" width="84" height="34" rx="6"/>
        <rect x="18" y="64" width="84" height="34" rx="6"/>
        <rect x="18" y="108" width="84" height="34" rx="6"/>
      </g>
      <g fill="#14B8A6">
        <circle cx="34" cy="37" r="6"/><circle cx="34" cy="81" r="6"/><circle cx="34" cy="125" r="6"/>
      </g>
      <g stroke="#2F6BFF" stroke-width="4" stroke-linecap="round">
        <path d="M50 37 H90 M50 81 H90 M50 125 H90"/>
      </g>
      <rect x="18" y="158" width="84" height="52" rx="8" fill="#0B1F4B"/>
      <text x="60" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5EEAD4">48V</text>
    </g>
    <!-- battery bank -->
    <g transform="translate(406 430)">
      <rect width="150" height="130" rx="14" fill="#FFFFFF" stroke="#0B1F4B" stroke-width="5"/>
      <g>
        <rect x="16" y="30" width="34" height="84" rx="6" fill="#2F6BFF"/>
        <rect x="58" y="30" width="34" height="84" rx="6" fill="#2F6BFF"/>
        <rect x="100" y="30" width="34" height="84" rx="6" fill="#F59E0B"/>
        <rect x="25" y="20" width="16" height="10" rx="3" fill="#0B1F4B"/>
        <rect x="67" y="20" width="16" height="10" rx="3" fill="#0B1F4B"/>
        <rect x="109" y="20" width="16" height="10" rx="3" fill="#0B1F4B"/>
      </g>
    </g>
    <!-- generator -->
    <g transform="translate(406 300)">
      <rect width="150" height="110" rx="14" fill="#0B1F4B"/>
      <g stroke="#3B5BA8" stroke-width="5" stroke-linecap="round">
        <path d="M24 30 V80 M42 30 V80 M60 30 V80"/>
      </g>
      <circle cx="112" cy="55" r="22" fill="#1B3473"/>
      <path d="M115 40 L104 58 H118 L109 72" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="118" y="-26" width="16" height="30" rx="4" fill="#0B1F4B"/>
    </g>
  </g>

  <!-- Data path -->
  <path d="M580 360 C 620 360 630 260 680 260" fill="none" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- Multi-site map -->
  <g transform="translate(680 70)" filter="url(#shadow)">
    <rect width="450" height="330" rx="28" fill="#FFFFFF"/>
    <g transform="translate(26 26)">
      <rect width="398" height="278" rx="18" fill="#F7F9FF"/>
      <path d="M40 70 C 90 30 170 40 220 28 C 290 12 360 50 370 110 C 380 170 330 200 300 240 C 260 280 160 262 110 240 C 60 218 20 180 26 130 C 30 100 30 84 40 70 Z" fill="#E6EEFF"/>
      <path d="M40 70 C 90 30 170 40 220 28 C 290 12 360 50 370 110 C 380 170 330 200 300 240 C 260 280 160 262 110 240 C 60 218 20 180 26 130 C 30 100 30 84 40 70 Z" fill="url(#dots)" opacity="0.8"/>
      <g stroke="#9DB6EE" stroke-width="3" stroke-dasharray="4 8" fill="none">
        <path d="M200 140 L90 100 M200 140 L300 80 M200 140 L120 210 M200 140 L310 200"/>
      </g>
      <circle cx="200" cy="140" r="18" fill="#0B1F4B"/>
      <circle cx="200" cy="140" r="6" fill="#FFFFFF"/>
      <g fill="#14B8A6">
        <circle cx="90" cy="100" r="11"/>
        <circle cx="120" cy="210" r="11"/>
        <circle cx="300" cy="80" r="11"/>
      </g>
      <circle cx="310" cy="200" r="30" fill="#F59E0B" opacity="0.2"/>
      <circle cx="310" cy="200" r="13" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Battery health trend -->
  <g transform="translate(680 426)" filter="url(#shadow)">
    <rect width="450" height="170" rx="24" fill="#FFFFFF"/>
    <g transform="translate(30 30)">
      <rect width="56" height="56" rx="16" fill="#FEF3C7"/>
      <g transform="translate(28 28)">
        <rect x="-16" y="-10" width="28" height="20" rx="4" fill="none" stroke="#B45309" stroke-width="3.5"/>
        <rect x="12" y="-4" width="4" height="8" rx="1.5" fill="#B45309"/>
        <rect x="-12" y="-6" width="9" height="12" rx="2" fill="#F59E0B"/>
      </g>
    </g>
    <g transform="translate(110 26)">
      <path d="M0 26 L60 30 L120 36 L180 46 L240 62 L300 84 L310 120 L0 120 Z" fill="url(#area)"/>
      <path d="M0 26 L60 30 L120 36 L180 46 L240 62" fill="none" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M240 62 L300 84" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
      <circle cx="300" cy="84" r="10" fill="#F59E0B"/>
    </g>
    <rect x="30" y="118" width="56" height="10" rx="5" fill="#0B1F4B" opacity="0.15"/>
  </g>
</svg>
